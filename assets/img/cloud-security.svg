<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430" role="img" aria-label="Cloud infrastructure protected by a lock, connected to server racks">
  <defs>
    <linearGradient id="cl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E3646"/><stop offset="1" stop-color="#282F3C"/>
    </linearGradient>
    <linearGradient id="lk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5AA9FF"/><stop offset="1" stop-color="#0A84FF"/>
    </linearGradient>
  </defs>

  <ellipse cx="300" cy="386" rx="230" ry="24" fill="#262D3A"/>
  <circle cx="82" cy="120" r="30" fill="#2A313F"/>
  <circle cx="524" cy="286" r="22" fill="#2A313F"/>

  <!-- cloud -->
  <g transform="translate(150 44)">
    <path d="M78 130c-26 0-46-20-46-45 0-24 18-43 41-45C81 17 105 0 133 0c33 0 60 24 65 55 24 3 42 23 42 47 0 15-7 28-19 28z" fill="url(#cl)" stroke="#232935" stroke-width="2"/>
  </g>

  <!-- lock on the cloud -->
  <g transform="translate(258 96)">
    <rect x="0" y="34" width="84" height="66" rx="12" fill="url(#lk)"/>
    <path d="M18 34V24a24 24 0 0 1 48 0v10" fill="none" stroke="#0A84FF" stroke-width="11" stroke-linecap="round"/>
    <circle cx="42" cy="62" r="9" fill="#2E3646"/>
    <rect x="38" y="66" width="8" height="18" rx="4" fill="#2E3646"/>
  </g>

  <!-- connection lines -->
  <path d="M212 214v34a12 12 0 0 0 12 12h48" fill="none" stroke="#1F242E" stroke-width="2.6" stroke-dasharray="6 6" stroke-linecap="round"/>
  <path d="M300 214v46" fill="none" stroke="#1F242E" stroke-width="2.6" stroke-dasharray="6 6" stroke-linecap="round"/>
  <path d="M388 214v34a12 12 0 0 1-12 12h-48" fill="none" stroke="#1F242E" stroke-width="2.6" stroke-dasharray="6 6" stroke-linecap="round"/>

  <!-- server racks -->
  <g transform="translate(178 266)">
