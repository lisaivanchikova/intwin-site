    <rect x="10" y="12" width="56" height="18" rx="4" fill="#8E9BB8"/>
    <circle cx="20" cy="21" r="4" fill="#8FB4FF"/><rect x="30" y="18" width="26" height="6" rx="3" fill="#7A8AAD"/>
    <rect x="10" y="40" width="56" height="18" rx="4" fill="#8E9BB8"/>
    <circle cx="20" cy="49" r="4" fill="#30D158"/><rect x="30" y="46" width="26" height="6" rx="3" fill="#7A8AAD"/>
    <rect x="10" y="68" width="56" height="18" rx="4" fill="#8E9BB8"/>
    <circle cx="20" cy="77" r="4" fill="#8FB4FF"/><rect x="30" y="74" width="26" height="6" rx="3" fill="#7A8AAD"/>
  </g>
  <g transform="translate(262 266)">
    <rect x="0" y="0" width="76" height="100" rx="9" fill="#0A84FF"/>
    <rect x="10" y="12" width="56" height="18" rx="4" fill="#2E3646" opacity=".25"/>
    <circle cx="20" cy="21" r="4" fill="#2E3646"/><rect x="30" y="18" width="26" height="6" rx="3" fill="#2E3646" opacity=".55"/>
    <rect x="10" y="40" width="56" height="18" rx="4" fill="#2E3646" opacity=".25"/>
    <circle cx="20" cy="49" r="4" fill="#2E3646"/><rect x="30" y="46" width="26" height="6" rx="3" fill="#2E3646" opacity=".55"/>
    <rect x="10" y="68" width="56" height="18" rx="4" fill="#2E3646" opacity=".25"/>
    <circle cx="20" cy="77" r="4" fill="#2E3646"/><rect x="30" y="74" width="26" height="6" rx="3" fill="#2E3646" opacity=".55"/>
  </g>
  <g transform="translate(346 266)">
    <rect x="0" y="0" width="76" height="100" rx="9" fill="#C2CBE0"/>
    <rect x="10" y="12" width="56" height="18" rx="4" fill="#8E9BB8"/>
    <circle cx="20" cy="21" r="4" fill="#30D158"/><rect x="30" y="18" width="26" height="6" rx="3" fill="#7A8AAD"/>
    <rect x="10" y="40" width="56" height="18" rx="4" fill="#8E9BB8"/>
    <circle cx="20" cy="49" r="4" fill="#8FB4FF"/><rect x="30" y="46" width="26" height="6" rx="3" fill="#7A8AAD"/>
    <rect x="10" y="68" width="56" height="18" rx="4" fill="#8E9BB8"/>
    <circle cx="20" cy="77" r="4" fill="#30D158"/><rect x="30" y="74" width="26" height="6" rx="3" fill="#7A8AAD"/>
  </g>

  <!-- floating badge -->
  <g transform="translate(410 158)">
    <rect x="0" y="0" width="112" height="40" rx="20" fill="#2E3646" stroke="#232935" stroke-width="1.6"/>
    <circle cx="22" cy="20" r="11" fill="#24352E"/>
    <path d="M17 20l4 4 7-8" fill="none" stroke="#30D158" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="40" y="12" width="56" height="6" rx="3" fill="#C2CBE0"/>
    <rect x="40" y="24" width="36" height="5" rx="2.5" fill="#222833"/>
