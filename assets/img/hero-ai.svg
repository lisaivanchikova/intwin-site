<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" role="img" aria-label="Automation engine triaging tickets, with an engineer reviewing the queue">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5AA9FF"/><stop offset="1" stop-color="#0A84FF"/>
    </linearGradient>
  </defs>

  <ellipse cx="300" cy="398" rx="240" ry="24" fill="#262D3A"/>
  <circle cx="512" cy="92" r="34" fill="#282F3C"/>
  <circle cx="70" cy="316" r="22" fill="#282F3C"/>

  <!-- incoming tickets (left column) -->
  <g>
    <rect x="40" y="96" width="128" height="40" rx="8" fill="#2E3646" stroke="#252B37"/>
    <circle cx="60" cy="116" r="8" fill="#3A2626"/><circle cx="60" cy="116" r="3" fill="#FF6A5E"/>
    <rect x="76" y="108" width="72" height="6" rx="3" fill="#222833"/>
    <rect x="76" y="120" width="46" height="6" rx="3" fill="#272D39"/>

    <rect x="40" y="150" width="128" height="40" rx="8" fill="#2E3646" stroke="#252B37"/>
    <circle cx="60" cy="170" r="8" fill="#3A3222"/><circle cx="60" cy="170" r="3" fill="#FFB44A"/>
    <rect x="76" y="162" width="60" height="6" rx="3" fill="#222833"/>
    <rect x="76" y="174" width="52" height="6" rx="3" fill="#272D39"/>

    <rect x="40" y="204" width="128" height="40" rx="8" fill="#2E3646" stroke="#252B37"/>
    <circle cx="60" cy="224" r="8" fill="#282F3C"/><circle cx="60" cy="224" r="3" fill="#0A84FF"/>
    <rect x="76" y="216" width="66" height="6" rx="3" fill="#222833"/>
    <rect x="76" y="228" width="38" height="6" rx="3" fill="#272D39"/>

    <rect x="40" y="258" width="128" height="40" rx="8" fill="#2E3646" stroke="#252B37"/>
    <circle cx="60" cy="278" r="8" fill="#24352E"/><circle cx="60" cy="278" r="3" fill="#30D158"/>
    <rect x="76" y="270" width="54" height="6" rx="3" fill="#222833"/>
    <rect x="76" y="282" width="60" height="6" rx="3" fill="#272D39"/>
  </g>

  <!-- flow lines into the engine -->
  <path d="M168 116c40 0 40 76 64 76" fill="none" stroke="#1F242E" stroke-width="2.4" stroke-dasharray="5 5" stroke-linecap="round"/>
  <path d="M168 170c34 0 34 22 64 22" fill="none" stroke="#1F242E" stroke-width="2.4" stroke-dasharray="5 5" stroke-linecap="round"/>
  <path d="M168 224c34 0 34-22 64-22" fill="none" stroke="#1F242E" stroke-width="2.4" stroke-dasharray="5 5" stroke-linecap="round"/>
  <path d="M168 278c40 0 40-76 64-76" fill="none" stroke="#1F242E" stroke-width="2.4" stroke-dasharray="5 5" stroke-linecap="round"/>

  <!-- the engine (chip) -->
  <g transform="translate(232 132)">
    <!-- pins -->
    <g fill="#1C212B">
      <rect x="-14" y="22" width="14" height="7" rx="3"/><rect x="-14" y="46" width="14" height="7" rx="3"/>
      <rect x="-14" y="70" width="14" height="7" rx="3"/><rect x="-14" y="94" width="14" height="7" rx="3"/>
      <rect x="126" y="22" width="14" height="7" rx="3"/><rect x="126" y="46" width="14" height="7" rx="3"/>
      <rect x="126" y="70" width="14" height="7" rx="3"/><rect x="126" y="94" width="14" height="7" rx="3"/>
      <rect x="22" y="-14" width="7" height="14" rx="3"/><rect x="46" y="-14" width="7" height="14" rx="3"/>
      <rect x="70" y="-14" width="7" height="14" rx="3"/><rect x="94" y="-14" width="7" height="14" rx="3"/>
      <rect x="22" y="126" width="7" height="14" rx="3"/><rect x="46" y="126" width="7" height="14" rx="3"/>
      <rect x="70" y="126" width="7" height="14" rx="3"/><rect x="94" y="126" width="7" height="14" rx="3"/>
    </g>
    <rect x="0" y="0" width="126" height="126" rx="18" fill="url(#chip)"/>
    <rect x="20" y="20" width="86" height="86" rx="12" fill="#2E3646" opacity=".16"/>
    <!-- neural nodes -->
    <g fill="#2E3646">
      <circle cx="42" cy="42" r="6"/><circle cx="42" cy="84" r="6"/>
      <circle cx="84" cy="42" r="6"/><circle cx="84" cy="84" r="6"/>
      <circle cx="63" cy="63" r="8"/>
    </g>
    <g stroke="#2E3646" stroke-width="2.2" opacity=".85">
      <path d="M42 42l21 21M84 42L63 63M42 84l21-21M84 84L63 63"/>
    </g>
  </g>

  <!-- outputs (right) -->
  <path d="M372 172c34 0 30-38 58-38" fill="none" stroke="#1F242E" stroke-width="2.4" stroke-dasharray="5 5" stroke-linecap="round"/>
  <path d="M372 226c34 0 30 40 58 40" fill="none" stroke="#1F242E" stroke-width="2.4" stroke-dasharray="5 5" stroke-linecap="round"/>

  <!-- resolved automatically -->
  <g transform="translate(430 110)">
    <rect x="0" y="0" width="136" height="52" rx="10" fill="#2E3646" stroke="#212730" stroke-width="1.6"/>
    <circle cx="26" cy="26" r="13" fill="#24352E"/>
    <path d="M20 26l4.5 4.5L33 22" fill="none" stroke="#30D158" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="48" y="15" width="72" height="7" rx="3.5" fill="#C2CBE0"/>
    <rect x="48" y="29" width="48" height="6" rx="3" fill="#222833"/>
  </g>

  <!-- escalated to a human -->
  <g transform="translate(430 240)">
    <rect x="0" y="0" width="136" height="52" rx="10" fill="#C2CBE0"/>
    <circle cx="26" cy="26" r="13" fill="#8FB4FF" opacity=".25"/>
    <circle cx="26" cy="21" r="5" fill="#8FB4FF"/>
    <path d="M17 34c1.6-5 4.8-7.5 9-7.5s7.4 2.5 9 7.5z" fill="#8FB4FF"/>
    <rect x="48" y="15" width="72" height="7" rx="3.5" fill="#2E3646"/>
    <rect x="48" y="29" width="52" height="6" rx="3" fill="#9AA5BF"/>
  </g>

  <!-- engineer at desk -->
  <g transform="translate(238 296)">
    <rect x="-6" y="76" width="140" height="8" rx="4" fill="#1F242E"/>
    <rect x="34" y="30" width="64" height="44" rx="5" fill="#C2CBE0"/>
    <rect x="40" y="36" width="52" height="32" rx="3" fill="#282F3C"/>
    <rect x="46" y="42" width="30" height="4" rx="2" fill="#1F242E"/>
    <rect x="46" y="50" width="40" height="4" rx="2" fill="#1F242E"/>
    <rect x="46" y="58" width="22" height="4" rx="2" fill="#0A84FF"/>
    <!-- person -->
    <circle cx="14" cy="34" r="13" fill="#F0C9A4"/>
    <path d="M1 34c0-9 6-15 13-15s13 6 13 15c-4-3-9-4-13-4s-9 1-13 4z" fill="#C2CBE0"/>
    <path d="M-6 78c0-18 9-30 20-30s20 12 20 30z" fill="#0A84FF"/>
  </g>
</svg>
